[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "biomars-protocol-studio"
version = "0.1.0"
description = "Evidence-grounded protocol drafting, with a focused research workspace."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "aiohttp>=3.12,<4", "httpx>=0.28,<1", "openai>=1.99,<3",
  "pydantic>=2.11,<3", "python-dotenv>=1.2.1,<2", "PyYAML>=6,<7",
  "json-repair>=0.51,<1", "beautifulsoup4>=4.13,<5", "requests>=2.32,<3",
  "PyMuPDF>=1.26,<2", "rapidfuzz>=3,<4", "rich>=14,<15", "psutil>=7,<8",
  "markdown-it-py>=3,<5", "reportlab>=4.4,<5",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["biomars*", "studio*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
